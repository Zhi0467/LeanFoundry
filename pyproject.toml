[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leanfoundry"
version = "0.0.1"
description = "Infrastructure for Lean proof search, replay, and evaluation"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Zhi"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13.4",
    "lean-client",
]

[project.scripts]
leanfoundry-reconcile-lifecycle = "leanfoundry.replay.lifecycle_cli:main"
leanfoundry-validate-backend = "leanfoundry.env_backend.validation_cli:main"

[project.optional-dependencies]
# Training-cluster only (Linux + CUDA). Installed explicitly with
# `uv sync --extra training`; not part of the default install. Slime is pinned
# to an explicit commit in [tool.uv.sources]; bump it deliberately and re-run
# the `slime` compat tests, never track main. See the Slime adapter notes in
# docs/internal-trackers/todo.md.
training = [
    "slime",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=6.2.1",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=5.0.0",
    "mypy>=0.991",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["leanfoundry*"]

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end tests requiring a live kimina-lean-server (opt-in via LEANFOUNDRY_E2E=1)",
    "slime: Slime API-compat tests; require the [training] extra (uv run --extra training pytest -m slime). Skip when slime is not installed.",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["leanfoundry"]

[tool.uv.sources]
lean-client = { git = "https://github.com/Zhi0467/kimina-lean-server.git", subdirectory = "packages/lean-client", branch = "main" }
slime = { git = "https://github.com/THUDM/slime.git", rev = "a897e1f40357fdf3b148f1eb4ce26e1aeccfcd2c" }
