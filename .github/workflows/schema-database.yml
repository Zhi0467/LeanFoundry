name: Schema and Database Consistency

on:
  pull_request:
  push:

jobs:
  schema-database:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5

      - name: Run tests without local backend dev dependency
        run: uv run --no-dev --with pytest pytest

      - name: Run lint without local backend dev dependency
        run: uv run --no-dev --with flake8 flake8 leanfoundry tests
